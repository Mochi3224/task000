<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D WebCraft</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; color: white; font-family: 'Inter', sans-serif; user-select: none; }
        #gameCanvas {
            image-rendering: pixelated;
            cursor: crosshair;
            display: block;
        }
        .ui-layer { position: absolute; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        
        /* Health Bar */
        #healthBarContainer { width: 300px; height: 20px; background: #333; border: 2px solid #000; position: absolute; top: 20px; left: 50%; transform: translateX(-50%); border-radius: 10px; overflow: hidden; z-index: 10; }
        #healthBar { height: 100%; background: #E53935; width: 100%; transition: width 0.2s; }
        
        /* Hotbar */
        #hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; background: rgba(0,0,0,0.6); padding: 6px; border-radius: 8px; z-index: 10; pointer-events: auto;}
        .hotbar-slot { width: 40px; height: 40px; background: rgba(255,255,255,0.2); border: 2px solid #555; border-radius: 4px; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; transition: 0.1s;}
        .hotbar-slot.selected { border-color: #FFF; transform: scale(1.1); background: rgba(255,255,255,0.4); }
        .slot-count { position: absolute; bottom: 2px; right: 4px; font-size: 12px; font-weight: bold; text-shadow: 1px 1px 0 #000; }
        .slot-img { width: 24px; height: 24px; }

        /* Inventory & Crafting Modal */
        #inventoryModal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(30,30,40,0.95); border: 4px solid #555; border-radius: 12px; padding: 20px; display: none; z-index: 20; width: 600px; pointer-events: auto; flex-direction: row; gap: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .inv-section { flex: 1; display: flex; flex-direction: column; }
        .inv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; overflow-y: auto; max-height: 300px;}
        .craft-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 300px; padding-right: 5px;}
        .craft-btn { background: #4CAF50; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; text-align: left; font-size: 14px; transition: 0.2s;}
        .craft-btn:hover:not(:disabled) { background: #45a049; }
        .craft-btn:disabled { background: #555; color: #888; cursor: not-allowed; }

        #deathScreen { z-index: 50; }
        #timeOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; transition: background-color 1s; }
        
        .block-icon { width: 100%; height: 100%; border-radius: 2px; }
    </style>
</head>
<body class="flex flex-col h-screen items-center justify-center">

    <!-- Login UI -->
    <div id="loginUI" class="flex flex-col items-center justify-center space-y-6 bg-gray-800 p-10 rounded-xl shadow-2xl z-50 absolute">
        <h1 class="text-4xl font-bold text-green-400 mb-2">2D WebCraft: Survival</h1>
        <p class="text-gray-300">Sign in to start surviving and save your world.</p>
        <button id="loginBtn" class="flex items-center gap-2 bg-white text-gray-800 px-6 py-3 rounded-lg font-semibold hover:bg-gray-100 transition shadow">
            <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/><path fill="none" d="M1 1h22v22H1z"/></svg>
            Sign in with Google
        </button>
        <div id="loginError" class="text-red-400 text-sm hidden text-center max-w-xs"></div>
    </div>

    <!-- Game Container -->
    <div id="gameUI" class="hidden relative w-full h-full bg-blue-300 overflow-hidden">
        
        <!-- Day/Night Overlay -->
        <div id="timeOverlay"></div>

        <canvas id="gameCanvas"></canvas>

        <!-- UI Layer -->
        <div class="ui-layer inset-0 flex flex-col pointer-events-none z-10">
            <!-- Top Bar -->
            <div class="flex justify-between items-center w-full p-4 pointer-events-auto">
                <div class="flex items-center gap-3 bg-gray-800 bg-opacity-70 p-2 rounded-lg">
                    <img id="userAvatar" src="" alt="Avatar" class="w-8 h-8 rounded-full hidden">
                    <span id="userName" class="font-medium text-gray-200"></span>
                    <button id="logoutBtn" class="text-red-400 hover:text-red-300 text-xs ml-2 underline">Logout</button>
                </div>
                <div class="flex flex-col items-end gap-2">
                    <div class="flex gap-2">
                        <button id="saveBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded font-medium transition text-sm shadow">Save</button>
                        <button id="loadBtn" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded font-medium transition text-sm shadow">Load</button>
                    </div>
                    <div id="statusMessage" class="text-yellow-300 text-sm font-mono h-5 drop-shadow-md"></div>
                </div>
            </div>

            <!-- Health Bar -->
            <div id="healthBarContainer"><div id="healthBar"></div></div>

            <!-- Controls Helper -->
            <div class="absolute top-20 left-4 text-white text-xs drop-shadow-md bg-black bg-opacity-50 p-2 rounded">
                [W/A/S/D] Move & Jump<br>
                [Left Click] Attack / Mine / Place<br>
                [Right Click] Place / Sleep<br>
                [E] Inventory & Crafting<br>
                [1-9] Select Item
            </div>
        </div>

        <!-- Hotbar -->
        <div id="hotbar">
            <!-- Generated via JS -->
        </div>

        <!-- Inventory / Crafting Modal -->
        <div id="inventoryModal">
            <div class="inv-section">
                <h2 class="text-xl font-bold text-white mb-4 border-b border-gray-600 pb-2">Inventory</h2>
                <div id="invGrid" class="inv-grid">
                    <!-- Items go here -->
                </div>
            </div>
            <div class="inv-section">
                <h2 class="text-xl font-bold text-white mb-4 border-b border-gray-600 pb-2">Crafting</h2>
                <div id="craftList" class="craft-list">
                    <!-- Recipes go here -->
                </div>
            </div>
            <button id="closeInvBtn" class="absolute top-2 right-2 text-gray-400 hover:text-white font-bold text-xl">&times;</button>
        </div>

        <!-- Death Screen -->
        <div id="deathScreen" class="hidden absolute inset-0 bg-red-900 bg-opacity-90 flex flex-col items-center justify-center text-white text-6xl font-bold pointer-events-none transition-opacity">
            YOU DIED
            <span class="text-xl mt-4 text-gray-300">Respawning...</span>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBqw6kx_1fMunXjmC79OfEPrtEwbk6CGM",
            authDomain: "task000.firebaseapp.com",
            projectId: "task000",
            storageBucket: "task000.firebasestorage.app",
            messagingSenderId: "776947135197",
            appId: "1:776947135197:web:11a0daad931efbfe41a134"
        };
        const appId = typeof __app_id !== 'undefined' ? __app_id : '2d-minecraft-survival';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        let currentUser = null;

        // --- Game Data & Definitions ---
        const TILE_SIZE = 20;
        const WORLD_COLS = 200;
        const WORLD_ROWS = 60;
        
        // Time constants (60fps)
        const FPS = 60;
        const DAY_FRAMES = 7 * 60 * FPS; // 7 mins
        const NIGHT_FRAMES = 3 * 60 * FPS; // 3 mins
        const TOTAL_DAY_CYCLE = DAY_FRAMES + NIGHT_FRAMES;

        // Dictionary of blocks and items
        const ITEMS = {
            0: { id: 0, name: 'Air', solid: false },
            1: { id: 1, name: 'Grass', color: '#4CAF50', type: 'block', drop: 1 },
            2: { id: 2, name: 'Dirt', color: '#795548', type: 'block', drop: 2 },
            3: { id: 3, name: 'Stone', color: '#9E9E9E', type: 'block', drop: 3 }, // drops stone/cobble
            4: { id: 4, name: 'Wood Log', color: '#5D4037', type: 'block', drop: 4 },
            5: { id: 5, name: 'Leaves', color: '#2E7D32', type: 'block', drop: null },
            6: { id: 6, name: 'Sand', color: '#FDD835', type: 'block', drop: 6 },
            7: { id: 7, name: 'Water', color: '#1E88E5', solid: false, liquid: true, type: 'block' },
            8: { id: 8, name: 'Iron Ore', color: '#BCAAA4', type: 'block', drop: 8, reqTool: 'stone_pick' },
            9: { id: 9, name: 'Diamond Ore', color: '#00BCD4', type: 'block', drop: 9, reqTool: 'stone_pick' },
            10: { id: 10, name: 'Bed', color: '#E53935', type: 'block', drop: 10 },
            11: { id: 11, name: 'Planks', color: '#D7CCC8', type: 'block', drop: 11 },
            
            // Items & Tools
            20: { id: 20, name: 'Stick', color: '#8D6E63', type: 'item' },
            21: { id: 21, name: 'Wood Pickaxe', color: '#A1887F', type: 'tool', toolType: 'pick', tier: 1, dmg: 2 },
            22: { id: 22, name: 'Stone Pickaxe', color: '#757575', type: 'tool', toolType: 'pick', tier: 2, dmg: 3 },
            23: { id: 23, name: 'Wood Axe', color: '#A1887F', type: 'tool', toolType: 'axe', tier: 1, dmg: 3 },
            24: { id: 24, name: 'Sword', color: '#9E9E9E', type: 'tool', toolType: 'sword', tier: 2, dmg: 6 },
            25: { id: 25, name: 'Pork', color: '#F48FB1', type: 'item' },
            26: { id: 26, name: 'Wool', color: '#EEEEEE', type: 'item' },
            27: { id: 27, name: 'Beef', color: '#D32F2F', type: 'item' },
            28: { id: 28, name: 'Chicken Meat', color: '#FFCC80', type: 'item' }
        };

        const RECIPES = [
            { result: {id: 11, count: 4}, req: [{id: 4, count: 1}], name: 'Planks x4' }, // Wood -> Planks
            { result: {id: 20, count: 4}, req: [{id: 11, count: 2}], name: 'Stick x4' }, // Planks -> Sticks
            { result: {id: 21, count: 1}, req: [{id: 11, count: 3}, {id: 20, count: 2}], name: 'Wood Pickaxe' },
            { result: {id: 22, count: 1}, req: [{id: 3, count: 3}, {id: 20, count: 2}], name: 'Stone Pickaxe' },
            { result: {id: 23, count: 1}, req: [{id: 11, count: 3}, {id: 20, count: 2}], name: 'Wood Axe' },
            { result: {id: 24, count: 1}, req: [{id: 3, count: 2}, {id: 20, count: 1}], name: 'Stone Sword' },
            { result: {id: 10, count: 1}, req: [{id: 26, count: 3}, {id: 11, count: 3}], name: 'Bed' }
        ];

        // --- State Variables ---
        let world = [];
        let timeTicks = 0;
        let isNight = false;
        
        // Exactly 1 block jump: v = 4.5, g = 0.5 => Height = 20.25px (1 block = 20px)
        const GRAVITY = 0.5;
        const JUMP_VEL = -4.5;
        const MAX_FALL = 10;

        let player = {
            x: 0, y: 0, w: 14, h: 24, vx: 0, vy: 0, speed: 3,
            hp: 100, maxHp: 100, dead: false, facingRight: true, grounded: false, inWater: false
        };

        let inventory = []; // Array of {id, count}
        let hotbarSelection = 0; // 0-8
        let mobs = [];
        let drops = [];
        let keys = {};
        let gameLoopId;
        let camera = { x: 0, y: 0 };

        // --- HTML Elements ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const timeOverlay = document.getElementById('timeOverlay');
        const hotbarEl = document.getElementById('hotbar');
        const invModal = document.getElementById('inventoryModal');
        const invGrid = document.getElementById('invGrid');
        const craftList = document.getElementById('craftList');
        const healthBar = document.getElementById('healthBar');
        const deathScreen = document.getElementById('deathScreen');
        const statusMessage = document.getElementById('statusMessage');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Core Functions ---
        function generateWorld() {
            world = [];
            let heights = [];
            // Simple terrain generation using sine waves
            for(let x=0; x<WORLD_COLS; x++) {
                let h = 20 + Math.sin(x*0.1)*5 + Math.sin(x*0.05)*3;
                heights.push(Math.floor(h));
            }

            for (let y = 0; y < WORLD_ROWS; y++) {
                let row = [];
                for (let x = 0; x < WORLD_COLS; x++) {
                    let terrainH = heights[x];
                    
                    if (y < terrainH) {
                        // Above ground
                        if (y >= 25) row.push(7); // Water level at y=25
                        else row.push(0); // Air
                    } else if (y === terrainH) {
                        // Surface
                        if (y >= 25) row.push(6); // Sand near water
                        else row.push(1); // Grass
                    } else if (y > terrainH && y < terrainH + 5) {
                        // Shallow underground
                        row.push(2); // Dirt
                    } else {
                        // Deep underground
                        let block = 3; // Stone
                        // Ores (only deep down)
                        if (y > 40) {
                            if (Math.random() < 0.03) block = 8; // Iron
                            if (y > 50 && Math.random() < 0.01) block = 9; // Diamond
                        }
                        row.push(block);
                    }
                }
                world.push(row);
            }

            // Trees Generation
            for (let x = 5; x < WORLD_COLS - 5; x++) {
                let h = heights[x];
                // Only on grass, above water, 10% chance
                if (h < 25 && world[h][x] === 1 && Math.random() < 0.1) {
                    // Prevent trees too close
                    if (world[h-1][x] !== 0) continue; 
                    
                    let treeHeight = 3 + Math.floor(Math.random()*3);
                    // Trunk
                    for(let ty = 1; ty <= treeHeight; ty++) {
                        if(h-ty >= 0) world[h-ty][x] = 4;
                    }
                    // Leaves
                    for(let ly = h-treeHeight-2; ly <= h-treeHeight; ly++) {
                        for(let lx = x-1; lx <= x+1; lx++) {
                            if(ly>=0 && lx>=0 && lx<WORLD_COLS && world[ly][lx]===0) {
                                world[ly][lx] = 5;
                            }
                        }
                    }
                }
            }

            // Init Player
            player.x = (WORLD_COLS / 2) * TILE_SIZE;
            player.y = (heights[WORLD_COLS/2] - 2) * TILE_SIZE;
            player.hp = player.maxHp;
            player.dead = false;
            
            mobs = [];
            drops = [];
            timeTicks = 0;
            updateUI();
        }

        function addToInventory(itemId, count = 1) {
            let existing = inventory.find(i => i.id === itemId);
            if (existing) {
                existing.count += count;
            } else {
                inventory.push({ id: itemId, count: count });
            }
            renderInventory();
        }

        function removeFromInventory(itemId, count = 1) {
            let index = inventory.findIndex(i => i.id === itemId);
            if (index !== -1) {
                inventory[index].count -= count;
                if (inventory[index].count <= 0) {
                    inventory.splice(index, 1);
                }
                renderInventory();
                return true;
            }
            return false;
        }

        function countItem(itemId) {
            let item = inventory.find(i => i.id === itemId);
            return item ? item.count : 0;
        }

        // --- Physics & Collision ---
        function checkTileCollision(ent) {
            let left = Math.floor(ent.x / TILE_SIZE);
            let right = Math.floor((ent.x + ent.w - 0.01) / TILE_SIZE);
            let top = Math.floor(ent.y / TILE_SIZE);
            let bottom = Math.floor((ent.y + ent.h - 0.01) / TILE_SIZE);

            if (left < 0 || right >= WORLD_COLS || top < 0 || bottom >= WORLD_ROWS) return true;

            ent.inWater = false;
            let hitSolid = false;

            for (let y = top; y <= bottom; y++) {
                for (let x = left; x <= right; x++) {
                    let bId = world[y][x];
                    if (bId !== 0) {
                        let blockDef = ITEMS[bId];
                        if (blockDef.liquid) {
                            ent.inWater = true;
                        } else if (blockDef.solid !== false) {
                            hitSolid = true;
                        }
                    }
                }
            }
            return hitSolid;
        }

        function moveEntity(ent, dx, dy) {
            ent.x += dx;
            if (checkTileCollision(ent)) {
                ent.x -= dx;
                ent.vx = 0;
                if(ent.type === 'zombie' || ent.type === 'witch' || ent.type === 'animal') ent.vxTarget *= -1; // reverse
            }
            
            ent.y += dy;
            if (checkTileCollision(ent)) {
                ent.y -= dy;
                if (dy > 0) { ent.vy = 0; ent.grounded = true; } 
                else if (dy < 0) { ent.vy = 0; }
            } else {
                ent.grounded = false;
            }
        }

        // --- Spawning & Entities ---
        function spawnMob(type) {
            let x = Math.random() * (WORLD_COLS * TILE_SIZE);
            let y = 5 * TILE_SIZE; // Drop from sky
            
            let m = { x, y, vx: 0, vy: 0, vxTarget: 1, type: type, hp: 20, maxHp: 20, dmg: 0, color: 'white', w: 14, h: 14 };
            
            switch(type) {
                case 'pig': m.color = '#F48FB1'; m.drop = 25; m.w = 16; break;
                case 'sheep': m.color = '#EEEEEE'; m.drop = 26; m.w = 16; break;
                case 'cow': m.color = '#795548'; m.drop = 27; m.w = 18; m.h = 18; m.hp = 30; break;
                case 'chicken': m.color = '#FFCC80'; m.drop = 28; m.w = 10; m.h = 10; m.hp = 5; break;
                case 'zombie': m.color = '#2E7D32'; m.hp = 30; m.dmg = 10; m.w = 14; m.h = 24; m.hostile = true; break;
                case 'witch': m.color = '#6A1B9A'; m.hp = 150; m.maxHp = 150; m.dmg = 20; m.w = 16; m.h = 26; m.hostile = true; m.boss = true; break;
            }
            m.vxTarget = (Math.random() > 0.5 ? 1 : -1);
            mobs.push(m);
        }

        function maintainMobs() {
            if (mobs.length < 5) {
                if (isNight) {
                    if (Math.random() < 0.05 && !mobs.some(m => m.boss)) spawnMob('witch');
                    else spawnMob('zombie');
                } else {
                    const animals = ['pig', 'sheep', 'cow', 'chicken'];
                    spawnMob(animals[Math.floor(Math.random() * animals.length)]);
                }
            }
        }

        function spawnDrop(id, x, y) {
            if(!id) return;
            // Pop slightly upwards
            drops.push({ id, x, y, w: 8, h: 8, vx: (Math.random()-0.5)*2, vy: -3, life: 600 });
        }

        // --- Game Update Loop ---
        function update() {
            if (!currentUser) return;

            // Time progression
            timeTicks++;
            if (timeTicks >= TOTAL_DAY_CYCLE) timeTicks = 0;
            
            let wasNight = isNight;
            isNight = timeTicks >= DAY_FRAMES;
            
            // Visual time update
            if (isNight) {
                let nightProgress = (timeTicks - DAY_FRAMES) / NIGHT_FRAMES;
                // Fade in night, stay dark, fade out
                let alpha = nightProgress < 0.1 ? nightProgress * 8 : (nightProgress > 0.9 ? (1-nightProgress)*10 : 0.8);
                timeOverlay.style.backgroundColor = `rgba(0, 0, 15, ${Math.min(0.8, alpha)})`;
            } else {
                timeOverlay.style.backgroundColor = `rgba(0,0,0,0)`;
                // Despawn hostiles instantly at daybreak for simplicity
                if(wasNight && !isNight) {
                    mobs = mobs.filter(m => !m.hostile);
                }
            }

            maintainMobs();

            // Player Physics
            if (!player.dead) {
                let speed = player.inWater ? player.speed * 0.5 : player.speed;
                if (keys['KeyA'] || keys['ArrowLeft']) { player.vx = -speed; player.facingRight = false; }
                else if (keys['KeyD'] || keys['ArrowRight']) { player.vx = speed; player.facingRight = true; }
                else { player.vx = 0; }

                if ((keys['KeyW'] || keys['ArrowUp'] || keys['Space'])) {
                    if (player.grounded) {
                        player.vy = JUMP_VEL;
                        player.grounded = false;
                    } else if (player.inWater) {
                        let headInWater = false;
                        let ty = Math.floor(player.y / TILE_SIZE);
                        let tx1 = Math.floor(player.x / TILE_SIZE);
                        let tx2 = Math.floor((player.x + player.w - 0.01) / TILE_SIZE);
                        if (ty >= 0 && ty < WORLD_ROWS) {
                            for(let x = tx1; x <= tx2; x++) {
                                let b = world[ty][x];
                                if(b !== 0 && ITEMS[b] && ITEMS[b].liquid) headInWater = true;
                            }
                        }
                        
                        if (headInWater) {
                            player.vy = JUMP_VEL * 0.6; // Swim up
                        } else {
                            player.vy = JUMP_VEL; // Pop out of water
                        }
                    }
                }

                let grav = player.inWater ? GRAVITY * 0.3 : GRAVITY;
                player.vy += grav;
                if (player.vy > MAX_FALL) player.vy = MAX_FALL;

                moveEntity(player, player.vx, player.vy);

                // Water physics logic (float slowly)
                if(player.inWater && player.vy > 2) player.vy = 2;

                // Death check
                if (player.y > WORLD_ROWS * TILE_SIZE) player.hp = 0;

                if (player.hp <= 0) {
                    player.dead = true;
                    player.vy = -8; // death jump
                    deathScreen.classList.remove('hidden');
                    setTimeout(() => {
                        player.hp = player.maxHp;
                        player.x = (WORLD_COLS / 2) * TILE_SIZE;
                        player.y = 10 * TILE_SIZE;
                        player.dead = false;
                        player.vx = 0; player.vy = 0;
                        deathScreen.classList.add('hidden');
                        updateUI();
                    }, 3000);
                }
            } else {
                // Dead motion
                player.y += player.vy;
                player.x += player.vx;
                player.vy += GRAVITY;
            }

            // Mobs Update
            for (let i = mobs.length - 1; i >= 0; i--) {
                let m = mobs[i];
                
                // AI
                if(m.hostile && !player.dead) {
                    let dist = Math.abs(m.x - player.x);
                    if(dist < 300) {
                        m.vxTarget = m.x < player.x ? 1 : -1;
                        if(m.boss) m.vxTarget *= 1.5; // boss faster
                        
                        // Jump over obstacles
                        if(m.grounded && m.vx === 0 && Math.random() < 0.1) m.vy = JUMP_VEL;
                        // Boss jump randomly
                        if(m.boss && m.grounded && Math.random() < 0.02) m.vy = JUMP_VEL * 1.2;
                    }
                } else if(Math.random() < 0.01) {
                    // Random walk
                    m.vxTarget = (Math.random() > 0.5 ? 1 : -1) * (m.boss ? 1.5 : 0.5);
                }

                m.vx = m.vxTarget;
                m.vy += m.inWater ? GRAVITY*0.3 : GRAVITY;
                if (m.vy > MAX_FALL) m.vy = MAX_FALL;

                moveEntity(m, m.vx, m.vy);

                // Damage Player
                if (m.hostile && !player.dead) {
                    if (player.x < m.x + m.w && player.x + player.w > m.x && player.y < m.y + m.h && player.y + player.h > m.y) {
                        player.hp -= m.dmg * 0.1; // Per frame damage, scaling
                        updateUI();
                        // Knockback
                        if(player.hp > 0) {
                            player.vx = (player.x > m.x) ? 5 : -5;
                            player.vy = -3;
                        }
                    }
                }

                if (m.hp <= 0 || m.y > WORLD_ROWS * TILE_SIZE) {
                    if(m.hp <= 0 && m.drop) spawnDrop(m.drop, m.x, m.y);
                    mobs.splice(i, 1);
                }
            }

            // Drops Update & Collection
            for (let i = drops.length - 1; i >= 0; i--) {
                let d = drops[i];
                d.vy += GRAVITY;
                if(d.vy > MAX_FALL) d.vy = MAX_FALL;
                moveEntity(d, d.vx, d.vy);
                d.vx *= 0.9; // friction
                d.life--;

                // Player pickup
                if (!player.dead && d.life < 580) { // small delay before pickup
                    if (player.x < d.x + d.w && player.x + player.w > d.x && player.y < d.y + d.h && player.y + player.h > d.y) {
                        addToInventory(d.id, 1);
                        drops.splice(i, 1);
                        continue;
                    }
                }

                if (d.life <= 0) drops.splice(i, 1);
            }

            // Camera follow
            camera.x = player.x - canvas.width / 2 + player.w / 2;
            camera.y = player.y - canvas.height / 2 + player.h / 2;
            
            // Clamp camera
            if(camera.x < 0) camera.x = 0;
            if(camera.x > WORLD_COLS * TILE_SIZE - canvas.width) camera.x = WORLD_COLS * TILE_SIZE - canvas.width;
            if(camera.y > WORLD_ROWS * TILE_SIZE - canvas.height) camera.y = WORLD_ROWS * TILE_SIZE - canvas.height;
        }

        // --- Interaction (Mining, Placing, Attacking) ---
        canvas.addEventListener('mousedown', (e) => {
            if(!currentUser || player.dead || invModal.style.display === 'flex') return;

            const mx = e.clientX + camera.x;
            const my = e.clientY + camera.y;

            let heldItem = inventory[hotbarSelection];
            let tool = heldItem ? ITEMS[heldItem.id] : null;

            // 1. Attack Mobs (Left Click)
            if (e.button === 0) {
                for (let i = 0; i < mobs.length; i++) {
                    let m = mobs[i];
                    if (mx >= m.x && mx <= m.x + m.w && my >= m.y && my <= m.y + m.h) {
                        let dmg = 5; // Base fists
                        if(tool && tool.type === 'tool') dmg += tool.dmg * 5;
                        
                        m.hp -= dmg;
                        m.vxTarget = (m.x > player.x) ? 4 : -4;
                        m.vy = -3;
                        return; // Did attack, don't mine
                    }
                }
            }

            // 2. Block Interaction
            const tx = Math.floor(mx / TILE_SIZE);
            const ty = Math.floor(my / TILE_SIZE);

            if (tx < 0 || tx >= WORLD_COLS || ty < 0 || ty >= WORLD_ROWS) return;
            
            // Distance check (reach = ~4 blocks)
            let dist = Math.hypot((tx*TILE_SIZE+10) - (player.x+player.w/2), (ty*TILE_SIZE+10) - (player.y+player.h/2));
            if(dist > TILE_SIZE * 5) return;

            if (e.button === 0) {
                // Left Click: Mine OR Place
                let bId = world[ty][tx];
                if (bId !== 0 && ITEMS[bId] && !ITEMS[bId].liquid) {
                    let blockInfo = ITEMS[bId];

                    // Check tool requirement
                    let canMine = true;
                    if (blockInfo.reqTool) {
                        if(!tool || tool.id !== 22) { // 22 is Stone Pickaxe
                            canMine = false;
                            showMessage("Requires Stone Pickaxe!", true);
                        }
                    }

                    if (canMine) {
                        world[ty][tx] = 0; // Break
                        if (blockInfo.drop) spawnDrop(blockInfo.drop, tx*TILE_SIZE + 4, ty*TILE_SIZE + 4);
                    }
                } else if (bId === 0 || (ITEMS[bId] && ITEMS[bId].liquid)) {
                    // Place block on Left Click if holding a block
                    if (heldItem && ITEMS[heldItem.id].type === 'block') {
                        let pRect = { left: player.x, right: player.x+player.w, top: player.y, bottom: player.y+player.h };
                        let bRect = { left: tx*TILE_SIZE, right: tx*TILE_SIZE+TILE_SIZE, top: ty*TILE_SIZE, bottom: ty*TILE_SIZE+TILE_SIZE };
                        
                        if (!(pRect.right > bRect.left && pRect.left < bRect.right && pRect.bottom > bRect.top && pRect.top < bRect.bottom)) {
                            world[ty][tx] = heldItem.id;
                            removeFromInventory(heldItem.id, 1);
                        }
                    }
                }
            } else if (e.button === 2) {
                // Right Click: Place / Use
                let bId = world[ty][tx];
                
                // If clicking a Bed
                if (bId === 10) {
                    if (isNight) {
                        timeTicks = 0; // Skip to morning
                        showMessage("Slept through the night!");
                    } else {
                        showMessage("You can only sleep at night.", true);
                    }
                    return;
                }

                // Placing blocks
                if (bId === 0 || ITEMS[bId].liquid) {
                    if (heldItem && ITEMS[heldItem.id].type === 'block') {
                        // Prevent placing inside player
                        let pRect = { left: player.x, right: player.x+player.w, top: player.y, bottom: player.y+player.h };
                        let bRect = { left: tx*TILE_SIZE, right: tx*TILE_SIZE+TILE_SIZE, top: ty*TILE_SIZE, bottom: ty*TILE_SIZE+TILE_SIZE };
                        
                        if (!(pRect.right > bRect.left && pRect.left < bRect.right && pRect.bottom > bRect.top && pRect.top < bRect.bottom)) {
                            world[ty][tx] = heldItem.id;
                            removeFromInventory(heldItem.id, 1);
                        }
                    }
                }
            }
        });
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        // --- Keyboard Inputs ---
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code >= 'Digit1' && e.code <= 'Digit9') {
                hotbarSelection = parseInt(e.code.replace('Digit', '')) - 1;
                renderInventory();
            }
            if (e.code === 'KeyE') {
                if (invModal.style.display === 'flex') invModal.style.display = 'none';
                else {
                    invModal.style.display = 'flex';
                    renderInventory();
                }
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        document.getElementById('closeInvBtn').addEventListener('click', () => invModal.style.display = 'none');

        // --- Render Loop ---
        function draw() {
            ctx.fillStyle = '#87CEEB'; // Sky blue
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(Math.floor(-camera.x), Math.floor(-camera.y));

            // Visible range
            let startCol = Math.max(0, Math.floor(camera.x / TILE_SIZE));
            let endCol = Math.min(WORLD_COLS, startCol + Math.ceil(canvas.width / TILE_SIZE) + 1);
            let startRow = Math.max(0, Math.floor(camera.y / TILE_SIZE));
            let endRow = Math.min(WORLD_ROWS, startRow + Math.ceil(canvas.height / TILE_SIZE) + 1);

            // Draw Blocks
            for (let y = startRow; y < endRow; y++) {
                for (let x = startCol; x < endCol; x++) {
                    let bId = world[y][x];
                    if (bId !== 0) {
                        ctx.fillStyle = ITEMS[bId].color;
                        
                        if (ITEMS[bId].liquid) {
                            ctx.globalAlpha = 0.7;
                            ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE + 4, TILE_SIZE, TILE_SIZE - 4);
                            ctx.globalAlpha = 1.0;
                        } else {
                            ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                            
                            // Simple texturing for specific blocks
                            if (bId === 1) { // Grass top
                                ctx.fillStyle = '#2E7D32';
                                ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, 4);
                            } else if (bId === 8 || bId === 9) { // Ores
                                ctx.fillStyle = bId === 8 ? '#FFFFFF' : '#E0F7FA';
                                ctx.fillRect(x * TILE_SIZE + 4, y * TILE_SIZE + 4, 4, 4);
                                ctx.fillRect(x * TILE_SIZE + 12, y * TILE_SIZE + 10, 4, 4);
                            }
                            
                            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                            ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        }
                    }
                }
            }

            // Draw Drops
            drops.forEach(d => {
                ctx.fillStyle = ITEMS[d.id].color;
                ctx.fillRect(d.x, d.y, d.w, d.h);
                ctx.strokeStyle = '#000';
                ctx.strokeRect(d.x, d.y, d.w, d.h);
            });

            // Draw Mobs
            mobs.forEach(m => {
                ctx.fillStyle = m.color;
                ctx.fillRect(m.x, m.y, m.w, m.h);
                
                // Witch hat
                if(m.boss) {
                    ctx.fillStyle = '#111';
                    ctx.beginPath();
                    ctx.moveTo(m.x-4, m.y);
                    ctx.lineTo(m.x+m.w+4, m.y);
                    ctx.lineTo(m.x+m.w/2, m.y-12);
                    ctx.fill();
                }

                // Health bar for mobs if hurt
                if(m.hp < m.maxHp) {
                    ctx.fillStyle = 'black';
                    ctx.fillRect(m.x, m.y - 6, m.w, 4);
                    ctx.fillStyle = 'red';
                    ctx.fillRect(m.x, m.y - 6, m.w * (m.hp / m.maxHp), 4);
                }
            });

            // Draw Player
            if (!player.dead) {
                ctx.fillStyle = '#0288D1'; // Body
                ctx.fillRect(player.x, player.y, player.w, player.h);
                ctx.fillStyle = '#FFB74D'; // Head
                ctx.fillRect(player.x + 2, player.y - 8, 10, 10);
                
                // Eyes
                ctx.fillStyle = 'black';
                if (player.facingRight) ctx.fillRect(player.x + 8, player.y - 6, 2, 2);
                else ctx.fillRect(player.x + 4, player.y - 6, 2, 2);

                // Held item visual
                let heldItem = inventory[hotbarSelection];
                if(heldItem && ITEMS[heldItem.id]) {
                    ctx.fillStyle = ITEMS[heldItem.id].color;
                    if(player.facingRight) ctx.fillRect(player.x + player.w, player.y + 4, 8, 8);
                    else ctx.fillRect(player.x - 8, player.y + 4, 8, 8);
                }
            } else {
                // Dead anim
                ctx.save();
                ctx.translate(player.x + player.w/2, player.y + player.h/2);
                ctx.rotate(timeTicks * 0.1);
                ctx.fillStyle = '#0288D1';
                ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
                ctx.restore();
            }

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        // --- UI Updates ---
        function updateUI() {
            if(healthBar) healthBar.style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
        }

        function showMessage(msg, isError = false) {
            statusMessage.textContent = msg;
            statusMessage.className = `text-sm font-mono h-5 drop-shadow-md ${isError ? 'text-red-400' : 'text-yellow-300'}`;
            setTimeout(() => { statusMessage.textContent = ''; }, 3000);
        }

        function renderInventory() {
            // Update Hotbar (first 9 slots)
            hotbarEl.innerHTML = '';
            for(let i=0; i<9; i++) {
                let slot = document.createElement('div');
                slot.className = `hotbar-slot ${i === hotbarSelection ? 'selected' : ''}`;
                slot.onclick = () => { hotbarSelection = i; renderInventory(); };
                
                let item = inventory[i];
                if(item) {
                    let def = ITEMS[item.id];
                    slot.innerHTML = `
                        <div class="slot-img" style="background-color: ${def.color};"></div>
                        ${item.count > 1 ? `<span class="slot-count">${item.count}</span>` : ''}
                    `;
                }
                hotbarEl.appendChild(slot);
            }

            // Update Full Inventory Grid
            if(invModal.style.display === 'flex') {
                invGrid.innerHTML = '';
                inventory.forEach(item => {
                    let def = ITEMS[item.id];
                    let div = document.createElement('div');
                    div.className = 'w-12 h-12 bg-gray-700 rounded flex items-center justify-center relative shadow-inner border border-gray-600';
                    div.innerHTML = `
                        <div class="w-8 h-8 rounded-sm" style="background-color: ${def.color};"></div>
                        ${item.count > 1 ? `<span class="absolute bottom-0 right-1 text-xs font-bold">${item.count}</span>` : ''}
                    `;
                    div.title = def.name;
                    invGrid.appendChild(div);
                });

                // Render Crafting
                craftList.innerHTML = '';
                RECIPES.forEach(recipe => {
                    // Check if can craft
                    let canCraft = true;
                    recipe.req.forEach(r => {
                        if(countItem(r.id) < r.count) canCraft = false;
                    });

                    let btn = document.createElement('button');
                    btn.className = 'craft-btn';
                    btn.disabled = !canCraft;
                    
                    let reqText = recipe.req.map(r => `${ITEMS[r.id].name}x${r.count}`).join(', ');
                    btn.innerHTML = `<strong>${recipe.name}</strong><br><span class="text-xs text-gray-200">Needs: ${reqText}</span>`;
                    
                    btn.onclick = () => {
                        if(canCraft) {
                            recipe.req.forEach(r => removeFromInventory(r.id, r.count));
                            addToInventory(recipe.result.id, recipe.result.count);
                            renderInventory();
                            showMessage(`Crafted ${recipe.name}!`);
                        }
                    };
                    craftList.appendChild(btn);
                });
            }
        }

        // --- Firebase Auth & Save/Load ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('loginUI').classList.add('hidden');
                document.getElementById('gameUI').classList.remove('hidden');
                document.getElementById('gameUI').classList.add('flex');
                
                document.getElementById('userName').textContent = user.displayName || user.email;
                if (user.photoURL) {
                    const avatar = document.getElementById('userAvatar');
                    avatar.src = user.photoURL;
                    avatar.classList.remove('hidden');
                }

                if(!world.length) generateWorld(); // generate default world
                renderInventory();
                if(!gameLoopId) gameLoopId = requestAnimationFrame(gameLoop);
            } else {
                currentUser = null;
                document.getElementById('loginUI').classList.remove('hidden');
                document.getElementById('gameUI').classList.add('hidden');
                document.getElementById('gameUI').classList.remove('flex');
                if(gameLoopId) { cancelAnimationFrame(gameLoopId); gameLoopId = null; }
            }
        });

        document.getElementById('loginBtn').addEventListener('click', async () => {
            try {
                document.getElementById('loginError').classList.add('hidden');
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login failed:", error);
                const errEl = document.getElementById('loginError');
                if (error.code === 'auth/unauthorized-domain') {
                    errEl.innerHTML = "Login failed: Unauthorized domain. Please add this preview URL to Firebase Console > Authentication > Settings > Authorized domains.";
                } else {
                    errEl.textContent = "Login failed. Ensure popups are allowed or try again.";
                }
                errEl.classList.remove('hidden');
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        // Save World
        document.getElementById('saveBtn').addEventListener('click', async () => {
            if (!currentUser) return;
            const btn = document.getElementById('saveBtn');
            try {
                btn.disabled = true; btn.innerText = "...";
                
                const saveData = {
                    world: JSON.stringify(world),
                    inventory: JSON.stringify(inventory),
                    playerData: JSON.stringify({ x: player.x, y: player.y, hp: player.hp }),
                    time: timeTicks,
                    timestamp: new Date()
                };

                const worldRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'savedGames', 'myWorld');
                await setDoc(worldRef, saveData);
                showMessage("Game Saved!");
            } catch (error) {
                console.error("Save error:", error);
                showMessage("Failed to save.", true);
            } finally {
                btn.disabled = false; btn.innerText = "Save";
            }
        });

        // Load World
        document.getElementById('loadBtn').addEventListener('click', async () => {
            if (!currentUser) return;
            const btn = document.getElementById('loadBtn');
            try {
                btn.disabled = true; btn.innerText = "...";

                const worldRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'savedGames', 'myWorld');
                const docSnap = await getDoc(worldRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    world = JSON.parse(data.world);
                    inventory = JSON.parse(data.inventory);
                    let pData = JSON.parse(data.playerData);
                    player.x = pData.x; player.y = pData.y; player.hp = pData.hp;
                    timeTicks = data.time || 0;
                    mobs = []; drops = []; player.dead = false;
                    
                    updateUI();
                    renderInventory();
                    showMessage("Game Loaded!");
                } else {
                    showMessage("No save found.", true);
                }
            } catch (error) {
                console.error("Load error:", error);
                showMessage("Failed to load.", true);
            } finally {
                btn.disabled = false; btn.innerText = "Load";
            }
        });

    </script>
</body>
</html>
